<main #main class="asys-page shell__page" [class.shell__page--bar]="onCapturePath() && open()">
  <router-outlet />
</main>
<p class="asys-visually-hidden shell__status" role="status">
  @for (notice of notices(); track notice.seq) {
    <span>{{ notice.text }}</span>
  }
</p>
@if (undoView(); as v) {
  <asys-undo-bar
    class="shell__undo"
    animate.enter="asys-rise"
    (animate.leave)="leave($event)"
    [variant]="v.variant"
    [title]="v.title"
    [detail]="v.detail"
    [canRetry]="v.canRetry"
    (undo)="doneUndo.undo()"
    (retry)="retryDone($event)"
    (dismiss)="dismissDone($event)"
    (escape)="focusMain()"
    (pointerInside)="inside(PauseReason.Pointer, $event)"
    (focusInside)="barFocus($event)"
  />
}
@if (onCapturePath() && open()) {
  <asys-quick-add
    class="shell__quickadd"
    animate.enter="asys-rise"
    (animate.leave)="leave($event)"
    [(value)]="text"
    [message]="captureQueue.message()"
    [failures]="captureQueue.failed()"
    (add)="add($event)"
    (retry)="captureQueue.retry($event)"
    (discard)="captureQueue.discard($event)"
    (close)="close()"
  />
}
<asys-bottom-nav
  class="shell__nav"
  [inboxCount]="dataStore.state() === null ? null : dataStore.inboxCount()"
>
  @if (onCapturePath()) {
    <button
      asys-capture-button
      #pill
      [count]="captureQueue.failed().length"
      [attr.aria-expanded]="open() ? 'true' : 'false'"
      (click)="toggleQuickAdd()"
    ></button>
  }
</asys-bottom-nav>
