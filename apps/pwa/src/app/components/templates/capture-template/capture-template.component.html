<h1 asys-text [textStyle]="TextStyle.Title" class="asys-page__title capture__title">Capture</h1>
<form class="capture__form" (submit)="submit($event)">
  <asys-text-field label="Title" [(value)]="title" />
  <button asys-button type="submit" [variant]="Variant.Primary" [disabled]="!canAdd()">Add</button>
</form>
<div class="capture__status" role="status">
  @if (confirmationText(); as captured) {
    <p asys-text class="capture__text">{{ captured }}</p>
    <p class="capture__links">
      <a asys-link [block]="true" routerLink="/inbox">Open the Inbox</a>
      <a asys-link [block]="true" routerLink="/now">Go to Now</a>
    </p>
  } @else if (message(); as text) {
    <p asys-text class="capture__text">{{ text }}</p>
  }
</div>
