<main class="asys-page sign-in">
  <h1 class="asys-page__title asys-page__title--flush sign-in__title">Sign in</h1>
  <p asys-text class="sign-in__body">Use the passkey you made for ASYS.</p>
  <button
    asys-button
    type="button"
    [block]="true"
    [variant]="Variant.Primary"
    [disabled]="!ready() || busy()"
    (click)="signIn.emit()"
  >
    Sign in with passkey
  </button>
  @if (message(); as text) {
    <p asys-text class="sign-in__message" role="alert">{{ text }}</p>
  }
  @if (loadFailed()) {
    <button
      asys-button
      type="button"
      [variant]="Variant.Quiet"
      [icon]="Icons.RotateRight"
      (click)="retry.emit()"
    >
      Try again
    </button>
  }
  <a asys-button routerLink="/recover" [variant]="Variant.Quiet">Use a recovery code</a>
</main>
