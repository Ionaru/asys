<h1 class="asys-page__title settings__title">Settings</h1>
<p class="asys-page__status settings__status" role="status">{{ statusLine() }}</p>
@if (loaded()) {
  <section class="settings__section">
    <asys-select-field
      label="Urgency window"
      [options]="urgencyOptions()"
      [(value)]="urgency"
      [disabled]="busy()"
      hint="A Task counts as urgent this many days before its Latest start."
    />
  </section>
  <section class="settings__section">
    <p class="settings__text">Current time zone: {{ currentZone() }}</p>
    <asys-select-field
      label="Time zone"
      [options]="zoneOptions()"
      [(value)]="zone"
      [disabled]="busy()"
      hint="Dates without a time follow this time zone. Your phone keeps it up to date."
    />
    @if (deviceZone(); as zone) {
      <div class="asys-button-group">
        <button
          asys-button
          type="button"
          [variant]="Variant.Secondary"
          [disabled]="busy()"
          (click)="useDeviceZone.emit(zone)"
        >
          Use this device's time zone ({{ zone }})
        </button>
      </div>
    }
  </section>
  @if (awaitingSync()) {
    <p asys-sync-note class="settings__sync"></p>
  }
} @else {
  <asys-load-state [failed]="failed()" (retry)="retry.emit()" />
}
<nav class="settings__links" aria-label="More settings">
  <a class="settings__link" routerLink="/settings/areas">Areas</a>
  <a class="settings__link" routerLink="/account">Account</a>
</nav>
