<form class="asys-quickadd" (submit)="submit($event)" (keydown.escape)="close.emit()">
  @for (failure of failures(); track failure.id) {
    <div class="asys-quickadd__failure">
      <p class="asys-quickadd__failure-text">
        <asys-icon [name]="Icons.TriangleExclamation" />Not captured: “{{ failure.text }}”
      </p>
      @if (failure.message !== null) {
        <p class="asys-quickadd__failure-reason">{{ failure.message }}</p>
      }
      <div class="asys-quickadd__failure-actions">
        @if (failure.canRetry) {
          <button
            asys-button
            type="button"
            [icon]="Icons.RotateRight"
            (click)="retryFailure(failure.id)"
          >
            Try again
          </button>
        }
        <button
          asys-button
          type="button"
          [variant]="Variants.Quiet"
          [icon]="Icons.Xmark"
          (click)="discardFailure(failure.id)"
        >
          Discard
        </button>
      </div>
    </div>
  }
  <asys-capture-field [(value)]="value" hint="Goes to the Inbox until Triage">
    <button
      asys-button
      type="button"
      [variant]="Variants.Quiet"
      [size]="Sizes.Small"
      (click)="close.emit()"
    >
      Close
    </button>
  </asys-capture-field>
  <p class="asys-quickadd__status" role="status">{{ message() }}</p>
</form>
