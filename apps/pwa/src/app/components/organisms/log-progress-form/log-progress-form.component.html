<form class="asys-progress" (submit)="submit($event)" (keydown.escape)="cancel.emit()">
  <asys-text-field
    label="Time still needed"
    inputmode="numeric"
    autocomplete="off"
    [(value)]="text"
    [hint]="hint()"
    [errors]="errors()"
    [touched]="error()"
  />
  <div asys-button-group>
    <button asys-button type="submit" [variant]="Variants.Primary" [disabled]="busy()">Save</button>
    <button asys-button type="button" [variant]="Variants.Quiet" (click)="cancel.emit()">
      Cancel
    </button>
  </div>
</form>
