<nav class="asys-bottomnav" aria-label="Primary">
  <a
    asys-nav-item
    routerLink="/now"
    routerLinkActive="is-current"
    #now="routerLinkActive"
    [icon]="IconName.Bullseye"
    [label]="'Now'"
    [current]="now.isActive"
    [pressed]="pressed() === '/now'"
    (pointerdown)="press($event, '/now')"
    (isActiveChange)="release()"
  ></a>
  <a
    asys-nav-item
    routerLink="/today"
    routerLinkActive="is-current"
    #today="routerLinkActive"
    [icon]="IconName.CalendarDay"
    [label]="'Today'"
    [current]="today.isActive"
    [pressed]="pressed() === '/today'"
    (pointerdown)="press($event, '/today')"
    (isActiveChange)="release()"
  ></a>
  <a
    asys-nav-item
    #inbox
    routerLink="/inbox"
    routerLinkActive="is-current"
    #inboxActive="routerLinkActive"
    [icon]="IconName.Inbox"
    [label]="'Inbox'"
    [current]="inboxActive.isActive"
    [count]="inboxCount()"
    [pressed]="pressed() === '/inbox'"
    (pointerdown)="press($event, '/inbox')"
    (isActiveChange)="release()"
  ></a>
  <ng-content />
</nav>
