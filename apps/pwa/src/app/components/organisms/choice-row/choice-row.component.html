<button
  #row
  type="button"
  class="asys-row asys-choice-row__open"
  aria-haspopup="dialog"
  [disabled]="disabled()"
  [attr.aria-describedby]="messageId()"
  (click)="sheetOpen.set(true)"
  (blur)="touch.emit()"
>
  <span class="asys-row__label">{{ label() }}</span>
  <span class="asys-row__value" [class.asys-row__value--set]="value() !== ''">
    @if (icon(); as name) {
      <asys-icon [name]="name" />
    }
    {{ chosenLabel() }}
  </span>
  <asys-icon class="asys-row__chevron" [name]="Chevron" />
</button>
@if (showError()) {
  <p asys-field-error [id]="messageParagraphId">{{ message() }}</p>
} @else if (hint()) {
  <p class="asys-field__hint" [id]="messageParagraphId">{{ hint() }}</p>
}
<asys-sheet [heading]="label()" [(open)]="sheetOpen">
  <ng-template>
    <ul class="asys-choice-row__options">
      @for (option of options(); track option.value) {
        <li>
          <button
            type="button"
            class="asys-row asys-choice-row__option"
            [attr.aria-pressed]="option.value === value() ? 'true' : 'false'"
            (click)="choose(option.value)"
          >
            @if (icon(); as name) {
              <asys-icon [name]="name" />
            }
            <span class="asys-row__label">{{ option.label }}</span>
            <asys-icon class="asys-choice-row__check" [name]="Check" />
          </button>
        </li>
      }
    </ul>
  </ng-template>
</asys-sheet>
