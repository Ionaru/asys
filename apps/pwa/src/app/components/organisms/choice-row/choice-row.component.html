<button
  asys-field-row
  class="asys-choice-row__open"
  [label]="label()"
  [value]="chosenLabel()"
  [set]="value() !== ''"
  [icon]="icon()"
  [disabled]="disabled()"
  [attr.aria-describedby]="messageId()"
  (click)="sheetOpen.set(true)"
  (blur)="touch.emit()"
></button>
@if (showError()) {
  <p asys-field-error [id]="messageParagraphId">{{ message() }}</p>
} @else if (hint()) {
  <p class="asys-field__hint" [id]="messageParagraphId">{{ hint() }}</p>
}
<asys-sheet [heading]="label()" [(open)]="sheetOpen">
  <ng-template>
    <ul class="asys-choice-row__options">
      @for (option of options(); track option.value) {
        <li>
          <button
            type="button"
            class="asys-field-row asys-choice-row__option"
            [attr.aria-pressed]="option.value === value() ? 'true' : 'false'"
            (click)="choose(option.value)"
          >
            @if (icon(); as name) {
              <asys-icon [name]="name" />
            }
            <span class="asys-field-row__label">{{ option.label }}</span>
            <asys-icon class="asys-choice-row__check" [name]="Check" />
          </button>
        </li>
      }
    </ul>
  </ng-template>
</asys-sheet>
