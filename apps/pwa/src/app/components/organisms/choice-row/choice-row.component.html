<button
  asys-field-row
  class="asys-choice-row__open"
  [label]="label()"
  [value]="chosenLabel()"
  [set]="value() !== ''"
  [icon]="icon()"
  [disabled]="disabled()"
  [attr.aria-describedby]="messageId()"
  (click)="sheetOpen.set(true)"
  (blur)="touch.emit()"
></button>
@if (showError()) {
  <p asys-field-error [id]="messageParagraphId">{{ message() }}</p>
} @else if (hint()) {
  <p class="asys-field__hint" [id]="messageParagraphId">{{ hint() }}</p>
}
<asys-sheet [heading]="label()" [(open)]="sheetOpen">
  <ng-template>
    <ul
      asys-option-list
      [options]="options()"
      [value]="value()"
      [icon]="icon()"
      (choose)="choose($event)"
    ></ul>
  </ng-template>
</asys-sheet>
