<div class="asys-date-row">
  <button
    #row
    type="button"
    class="asys-row asys-date-row__open"
    aria-haspopup="dialog"
    [disabled]="disabled()"
    [attr.aria-describedby]="messageId()"
    (click)="dateOpen.set(true)"
    (blur)="touch.emit()"
  >
    <span class="asys-row__label">{{ label() }}</span>
    <span class="asys-row__value" [class.asys-row__value--set]="value() !== null">{{
      dateText()
    }}</span>
    <asys-icon class="asys-row__chevron" [name]="Chevron" />
  </button>
  @if (value(); as spec) {
    <button
      type="button"
      class="asys-num asys-date-row__time"
      aria-haspopup="dialog"
      [class.asys-date-row__time--set]="spec.time !== undefined"
      [disabled]="disabled()"
      [attr.aria-label]="timeLabel()"
      (click)="timeOpen.set(true)"
    >
      <asys-icon [name]="Clock" />
      @if (spec.time) {
        {{ spec.time }}
      }
    </button>
  }
</div>
@if (showError()) {
  <p asys-field-error [id]="messageParagraphId">{{ message() }}</p>
} @else if (hint()) {
  <p class="asys-field__hint" [id]="messageParagraphId">{{ hint() }}</p>
}
<asys-sheet [heading]="label()" [(open)]="dateOpen">
  <ng-template>
    <asys-date-picker
      [today]="today()"
      [value]="value()?.date ?? null"
      [removeLabel]="removeLabel()"
      (pick)="pickDate($event)"
      (remove)="removeDate()"
    />
  </ng-template>
</asys-sheet>
<asys-sheet heading="Time" [(open)]="timeOpen">
  <ng-template>
    <asys-time-pick
      [value]="value()?.time ?? null"
      [context]="timeContext()"
      (pick)="pickTime($event)"
      (remove)="removeTime()"
    />
  </ng-template>
</asys-sheet>
