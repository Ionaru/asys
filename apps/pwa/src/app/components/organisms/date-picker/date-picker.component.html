<div class="asys-date-picker__chips" role="group" aria-label="Quick dates">
  @for (chip of chips(); track $index) {
    <button asys-segment [pressed]="value() === chip.date" (click)="choose(chip.date)">
      {{ chip.label }}
    </button>
  }
</div>
<div asys-calendar [today]="today()" [value]="value()" (pick)="choose($event)"></div>
<div class="asys-field asys-date-picker__other">
  <label asys-label [for]="otherId">Other date</label>
  <input
    #otherInput
    asys-input
    type="date"
    [id]="otherId"
    [attr.min]="today()"
    [value]="value() ?? ''"
    [attr.aria-invalid]="pastTyped() ? 'true' : null"
    [attr.aria-describedby]="pastTyped() ? errorId : null"
    (change)="typeDate(otherInput.value)"
  />
  @if (pastTyped()) {
    <p asys-field-error [id]="errorId">Pick today or a later date.</p>
  }
</div>
@if (value() !== null) {
  <button
    asys-button
    type="button"
    class="asys-date-picker__remove"
    [variant]="Variant.Secondary"
    [block]="true"
    (click)="remove.emit()"
  >
    {{ removeLabel() }}
  </button>
}
