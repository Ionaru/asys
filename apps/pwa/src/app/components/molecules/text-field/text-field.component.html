<div
  class="asys-field"
  [class.asys-field--error]="showError()"
  [class.asys-field--disabled]="disabled()"
>
  <label asys-label [for]="controlId">{{ label() }}</label>
  @if (multiline()) {
    <textarea
      #control
      asys-input
      [id]="controlId"
      [value]="value()"
      [disabled]="disabled()"
      [attr.placeholder]="placeholder()"
      [attr.autocomplete]="autocomplete()"
      [attr.autocapitalize]="autocapitalize()"
      [attr.inputmode]="inputmode()"
      [attr.spellcheck]="spellcheck() ? null : 'false'"
      [attr.aria-invalid]="showError() ? 'true' : null"
      [attr.aria-describedby]="messageId()"
      (input)="value.set(control.value)"
      (blur)="touch.emit()"
    ></textarea>
  } @else if (autofill()) {
    <input
      #control
      asys-input
      type="text"
      [id]="controlId"
      [value]="value()"
      [disabled]="disabled()"
      [attr.placeholder]="placeholder()"
      [attr.autocomplete]="autocomplete()"
      [attr.autocapitalize]="autocapitalize()"
      [attr.inputmode]="inputmode()"
      [attr.spellcheck]="spellcheck() ? null : 'false'"
      [attr.aria-invalid]="showError() ? 'true' : null"
      [attr.aria-describedby]="messageId()"
      (input)="value.set(control.value)"
      (blur)="touch.emit()"
    />
  } @else {
    <asys-input-box>
      <textarea
        #control
        asys-single-line
        [id]="controlId"
        [value]="value()"
        [disabled]="disabled()"
        [attr.placeholder]="placeholder()"
        [attr.autocomplete]="autocomplete()"
        [attr.autocapitalize]="autocapitalize()"
        [attr.inputmode]="inputmode()"
        [attr.spellcheck]="spellcheck() ? null : 'false'"
        [attr.aria-invalid]="showError() ? 'true' : null"
        [attr.aria-describedby]="messageId()"
        (lineChange)="value.set($event)"
        (blur)="touch.emit()"
      ></textarea>
    </asys-input-box>
  }
  @if (showError()) {
    <p asys-field-error [id]="messageParagraphId">{{ message() }}</p>
  } @else if (hint()) {
    <p class="asys-field__hint" [id]="messageParagraphId">{{ hint() }}</p>
  }
</div>
