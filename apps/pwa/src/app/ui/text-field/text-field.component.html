<div
  class="asys-field"
  [class.asys-field--error]="showError()"
  [class.asys-field--disabled]="disabled()"
>
  <label class="asys-field__label" [for]="controlId">{{ label() }}</label>
  @if (multiline()) {
    <textarea
      #control
      class="asys-field__input"
      [id]="controlId"
      [value]="value()"
      [disabled]="disabled()"
      [attr.placeholder]="placeholder()"
      [attr.autocomplete]="autocomplete()"
      [attr.autocapitalize]="autocapitalize()"
      [attr.spellcheck]="spellcheck() ? null : 'false'"
      [attr.aria-invalid]="showError() ? 'true' : null"
      [attr.aria-describedby]="messageId()"
      (input)="value.set(control.value)"
      (blur)="touch.emit()"
    ></textarea>
  } @else if (autofill()) {
    <input
      #control
      class="asys-field__input"
      type="text"
      [id]="controlId"
      [value]="value()"
      [disabled]="disabled()"
      [attr.placeholder]="placeholder()"
      [attr.autocomplete]="autocomplete()"
      [attr.autocapitalize]="autocapitalize()"
      [attr.spellcheck]="spellcheck() ? null : 'false'"
      [attr.aria-invalid]="showError() ? 'true' : null"
      [attr.aria-describedby]="messageId()"
      (input)="value.set(control.value)"
      (blur)="touch.emit()"
    />
  } @else {
    <div class="asys-field__input asys-field__box" (mousedown)="pressBox($event)">
      <textarea
        #control
        class="asys-field__line"
        rows="1"
        [id]="controlId"
        [value]="value()"
        [disabled]="disabled()"
        [attr.placeholder]="placeholder()"
        [attr.autocomplete]="autocomplete()"
        [attr.autocapitalize]="autocapitalize()"
        [attr.spellcheck]="spellcheck() ? null : 'false'"
        [attr.aria-invalid]="showError() ? 'true' : null"
        [attr.aria-describedby]="messageId()"
        (input)="value.set(flattenLines(control))"
        (keydown)="enterAsInput($event)"
        (beforeinput)="enterAsInput($event)"
        (blur)="touch.emit()"
      ></textarea>
    </div>
  }
  @if (showError()) {
    <p asys-field-error [id]="messageParagraphId">{{ message() }}</p>
  } @else if (hint()) {
    <p class="asys-field__hint" [id]="messageParagraphId">{{ hint() }}</p>
  }
</div>
