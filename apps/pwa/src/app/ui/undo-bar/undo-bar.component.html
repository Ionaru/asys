@switch (variant()) {
  @case (Variant.Done) {
    <p class="asys-undobar__text asys-undobar__text--done">
      <svg class="asys-undobar__check" aria-hidden="true" viewBox="0 0 24 24">
        <path
          d="M5 12.5l4.5 4.5L19 7.5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span class="asys-undobar__done">Done</span>
      <span class="asys-undobar__title">{{ title() }}</span>
    </p>
    <button
      asys-button
      type="button"
      class="asys-undobar__action"
      [variant]="Variants.Quiet"
      (click)="undo.emit()"
    >
      Undo
    </button>
  }
  @case (Variant.Failed) {
    <p class="asys-undobar__text">“{{ title() }}” is not Done.</p>
    @if (detail() !== null) {
      <p class="asys-undobar__detail">{{ detail() }}</p>
    }
    @if (canRetry()) {
      <button
        asys-button
        type="button"
        class="asys-undobar__action"
        (click)="retry.emit({ keyboard: $event.detail === 0 })"
      >
        Try again
      </button>
    }
    <button
      asys-button
      type="button"
      class="asys-undobar__action"
      [variant]="Variants.Quiet"
      (click)="dismiss.emit({ keyboard: $event.detail === 0 })"
    >
      Dismiss
    </button>
  }
  @case (Variant.Notice) {
    @if (detail() !== null) {
      <p class="asys-undobar__detail">{{ detail() }}</p>
    }
    <button
      asys-button
      type="button"
      class="asys-undobar__action"
      [variant]="Variants.Quiet"
      (click)="dismiss.emit({ keyboard: $event.detail === 0 })"
    >
      Dismiss
    </button>
  }
}
