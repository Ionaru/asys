@switch (variant()) {
  @case (Variant.Done) {
    <asys-icon class="asys-undo__check" [name]="Icons.Check" />
    <span class="asys-undo__text">
      <span class="asys-undo__status">Done</span>
      <span class="asys-undo__title">{{ title() }}</span>
    </span>
    <button
      asys-button
      type="button"
      class="asys-undo__button"
      [variant]="Variants.Secondary"
      [attr.aria-label]="'Undo Done: ' + title()"
      (click)="undo.emit()"
    >
      <span class="asys-undo__timer" aria-hidden="true">
        <svg viewBox="0 0 20 20">
          <circle class="asys-undo__ring" cx="10" cy="10" r="9" />
          <circle
            #fill
            class="asys-undo__fill"
            cx="10"
            cy="10"
            r="3.25"
            pathLength="100"
            transform="rotate(-90 10 10)"
          />
        </svg>
      </span>
      Undo
    </button>
  }
  @case (Variant.Failed) {
    <p class="asys-undo__text asys-undo__text--failed">“{{ title() }}” is not Done.</p>
    @if (detail() !== null) {
      <p class="asys-undo__detail">{{ detail() }}</p>
    }
    @if (canRetry()) {
      <button
        asys-button
        type="button"
        class="asys-undo__action"
        [variant]="Variants.Secondary"
        [icon]="Icons.RotateRight"
        (click)="retry.emit(activationOf($event))"
      >
        Try again
      </button>
    }
    <button
      asys-button
      type="button"
      class="asys-undo__action"
      [variant]="Variants.Quiet"
      (click)="dismiss.emit(activationOf($event))"
    >
      Dismiss
    </button>
  }
  @case (Variant.Notice) {
    @if (detail() !== null) {
      <p class="asys-undo__detail">{{ detail() }}</p>
    }
    <button
      asys-button
      type="button"
      class="asys-undo__action"
      [variant]="Variants.Quiet"
      (click)="dismiss.emit(activationOf($event))"
    >
      Dismiss
    </button>
  }
}
