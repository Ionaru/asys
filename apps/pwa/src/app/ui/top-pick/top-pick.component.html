<article class="asys-top-pick">
  @if (overdue()) {
    <div class="asys-top-pick__flags">
      <asys-status-badge [status]="Statuses.Overdue" />
    </div>
  }
  <h2 class="asys-top-pick__title">
    <a class="asys-top-pick__link" [routerLink]="taskId() === null ? null : ['/tasks', taskId()]">
      <span
        class="asys-top-pick__title-text"
        [attr.data-task-id]="taskId()"
        [attr.data-morph]="morph() ? '' : null"
        >{{ title() }}</span
      >
      <asys-icon [name]="Icons.ChevronRight" />
    </a>
  </h2>
  <p class="asys-top-pick__reason">
    @if (reasonParts(); as parts) {
      <span class="asys-danger-text">{{ parts.fact }}</span
      ><ng-container>{{ parts.rest }}</ng-container>
    } @else {
      <ng-container>{{ reason() }}</ng-container>
    }
  </p>
  <ul class="asys-facts">
    <li asys-fact [icon]="Icons.Stopwatch" label="Estimate:" [strong]="true">
      <span class="asys-num">{{ estimate() }}</span>
    </li>
    @if (area() !== null) {
      <li asys-fact [icon]="Icons.Folder" label="Area:">{{ area() }}</li>
    }
    <li asys-quadrant-chip [quadrant]="quadrant()"></li>
  </ul>
  <div class="asys-top-pick__actions">
    @if (completed()) {
      <p class="asys-top-pick__done">
        <svg class="asys-top-pick__check" aria-hidden="true" viewBox="0 0 24 24">
          <path
            pathLength="1"
            d="M5 12.5l4.5 4.5L19 7.5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Done
      </p>
    } @else {
      <div class="asys-button-group asys-button-group--fill">
        <button
          asys-button
          type="button"
          [variant]="Variants.Primary"
          [size]="Sizes.Large"
          [icon]="Icons.Check"
          class="asys-top-pick__main-action"
          [disabled]="actionsDisabled()"
          (click)="done.emit({ keyboard: $event.detail === 0 })"
        >
          Done
        </button>
        @if (canLogProgress()) {
          <button
            asys-button
            type="button"
            [variant]="Variants.Secondary"
            [size]="Sizes.Large"
            [icon]="Icons.BarProgressHalf"
            class="asys-top-pick__secondary asys-top-pick__log-progress"
            [disabled]="actionsDisabled()"
            (click)="logProgress.emit()"
          >
            Log progress
          </button>
        }
      </div>
    }
  </div>
  <ng-content />
</article>
