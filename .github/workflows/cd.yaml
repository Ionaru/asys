# SPDX-License-Identifier: EUPL-1.2
name: CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  # Runs on main queue instead, so a deploy is never cancelled half way.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: $/.github/actions/checkout
      - name: Set up pnpm without installing dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: false
      - name: Audit the lockfile
        run: pnpm audit --prod

  lint:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up
        uses: $/.github/actions/setup
      - name: Lint
        run: pnpm exec nx run-many -t lint

  typecheck:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up
        uses: $/.github/actions/setup
      - name: Typecheck the projects
        run: pnpm exec nx run-many -t typecheck
      - name: Typecheck the scripts
        run: pnpm exec tsc -p scripts/tsconfig.json

  build:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up
        uses: $/.github/actions/setup
      - name: Build
        run: pnpm exec nx run-many -t build
      - name: OpenAPI document
        run: pnpm exec nx run server:openapi

  test:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up
        uses: $/.github/actions/setup
      - name: Write .env
        run: |
          owner_pw="$(openssl rand -hex 24)"
          app_pw="$(openssl rand -hex 24)"
          (
            umask 077
            {
              echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
              echo "ASYS_OWNER_PASSWORD=${owner_pw}"
              echo "ASYS_APP_PASSWORD=${app_pw}"
              echo "DATABASE_URL_OWNER=postgresql://asys_owner:${owner_pw}@127.0.0.1:5432/asys"
              echo "DATABASE_URL_APP=postgresql://asys_app:${app_pw}@127.0.0.1:5432/asys"
            } > .env
          )
      - name: Start the database
        run: docker compose up -d --wait
      - name: Apply migrations
        run: pnpm exec drizzle-kit migrate --config apps/server/drizzle.config.ts
      - name: Smoke import drizzle-orm/effect-postgres (ADR 0009)
        run: node --input-type=module -e "await import('drizzle-orm/effect-postgres')"
      - name: Test
        run: pnpm exec nx run-many -t test --skip-nx-cache

  e2e:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up
        uses: $/.github/actions/setup
      - name: Write .env
        run: |
          owner_pw="$(openssl rand -hex 24)"
          app_pw="$(openssl rand -hex 24)"
          (
            umask 077
            {
              echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
              echo "ASYS_OWNER_PASSWORD=${owner_pw}"
              echo "ASYS_APP_PASSWORD=${app_pw}"
              echo "DATABASE_URL_OWNER=postgresql://asys_owner:${owner_pw}@127.0.0.1:5432/asys"
              echo "DATABASE_URL_APP=postgresql://asys_app:${app_pw}@127.0.0.1:5432/asys"
            } > .env
          )
      - name: Start the database
        run: docker compose up -d --wait
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm exec nx e2e pwa-e2e
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright
          path: dist/.playwright
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  format:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up
        uses: $/.github/actions/setup
      - name: Check formatting
        run: pnpm exec nx format:check --all

  licences:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up
        uses: $/.github/actions/setup
      - name: Check SPDX headers
        run: node scripts/check-spdx.mts
      - name: Lint REUSE compliance
        run: pipx run reuse==6.2.0 lint
      - name: Check dependency licences
        run: node scripts/check-licenses.mts

  palettes:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up
        uses: $/.github/actions/setup
      - name: Check the curated palettes
        run: node scripts/palettes.mts --check

  image:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      short: ${{ steps.revision.outputs.short }}
    steps:
      - name: Check out
        uses: $/.github/actions/checkout
      - name: Set up pnpm and Node without installing dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
      - name: Work out the revision
        id: revision
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Write deploy/.env
        run: |
          (
            umask 077
            {
              echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
              echo "ASYS_OWNER_PASSWORD=$(openssl rand -hex 32)"
              echo "ASYS_APP_PASSWORD=$(openssl rand -hex 32)"
              echo "ASYS_PUBLIC_ORIGIN=http://localhost:3000"
              echo "ASYS_RP_ID=localhost"
              # Empty: no telemetry export in CI.
              echo "ASYS_OTLP_ENDPOINT="
            } > deploy/.env
          )
      - name: Create the external networks
        run: |
          docker network create edge
          docker network create telemetry
      - name: Build the image
        run: docker compose -f deploy/compose.yaml build asys --build-arg ASYS_GIT_REVISION="${{ steps.revision.outputs.short }}"
      - name: Start the stack and smoke-test it
        run: |
          docker compose -f deploy/compose.yaml up -d --wait
          node scripts/smoke-image.mts
      - name: Start the stack again on the migrated database
        # The migrate container runs again and must exit 0; asys must stay healthy.
        run: docker compose -f deploy/compose.yaml up -d --wait
      - name: Show the stack state and logs
        if: failure()
        run: |
          docker compose -f deploy/compose.yaml ps -a
          docker compose -f deploy/compose.yaml logs --no-color
      - name: Save the image
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: docker save -o asys-image.tar ghcr.io/ionaru/asys:latest
      - name: Upload the image
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asys-image
          path: asys-image.tar
          retention-days: 1
          if-no-files-found: error

  push-image:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [audit, lint, typecheck, build, test, e2e, format, licences, palettes, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: asys-image
      - name: Load and tag the image
        run: |
          docker load -i asys-image.tar
          docker tag ghcr.io/ionaru/asys:latest "ghcr.io/ionaru/asys:${{ needs.image.outputs.short }}"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image
        run: |
          docker push ghcr.io/ionaru/asys:latest
          docker push "ghcr.io/ionaru/asys:${{ needs.image.outputs.short }}"

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [image, push-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ASYS_GIT_REVISION: ${{ needs.image.outputs.short }}
          ASYS_GIT_SHA: ${{ needs.image.outputs.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: DEPLOY_PATH,ASYS_GIT_REVISION,ASYS_GIT_SHA
          command_timeout: 15m
          script: |
            set -eu
            : "${ASYS_GIT_REVISION:?}"
            : "${ASYS_GIT_SHA:?}"
            cd "$DEPLOY_PATH"
            git fetch --prune origin
            git checkout --force "$ASYS_GIT_SHA"
            cd deploy

            # Keep the deployed revision in .env so manual docker compose commands
            # on the VPS use the deployed image too.
            if grep -q '^ASYS_GIT_REVISION=' .env; then
              sed -i "s|^ASYS_GIT_REVISION=.*|ASYS_GIT_REVISION=${ASYS_GIT_REVISION}|" .env
            else
              echo "ASYS_GIT_REVISION=${ASYS_GIT_REVISION}" >> .env
            fi

            docker compose pull

            start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            rc=0
            # Under set -eu, capturing the status with || rc=$? keeps the logs below printing.
            docker compose up --detach --pull=never --no-build --remove-orphans --wait --wait-timeout 300 || rc=$?

            # The repository's Actions logs are public, so the app's logs are
            # printed only when the deploy failed.
            docker compose ps
            docker compose logs --no-color migrate
            if [ "$rc" -ne 0 ]; then
              docker compose logs --no-color --since "$start" asys
              exit "$rc"
            fi

            # Remove stale asys images only; other stacks share this daemon.
            stale="$(docker image ls --format '{{.Repository}}:{{.Tag}}' \
              --filter 'reference=ghcr.io/ionaru/asys' \
              | grep -vx "ghcr.io/ionaru/asys:${ASYS_GIT_REVISION}" || true)"
            if [ -n "$stale" ]; then
              echo "$stale" | xargs -r docker image rm --force || true
            fi
