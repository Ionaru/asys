name: Check out
description: Check out the repository without persisting the GitHub token.

runs:
  using: composite
  steps:
    - name: Check out
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
