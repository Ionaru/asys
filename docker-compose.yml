services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ASYS_OWNER_PASSWORD: ${ASYS_OWNER_PASSWORD:?set ASYS_OWNER_PASSWORD in .env}
      ASYS_APP_PASSWORD: ${ASYS_APP_PASSWORD:?set ASYS_APP_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # From PostgreSQL 18 the image keeps its data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the socket: the init server only listens on the socket, so this
      # stays unhealthy until the init scripts have finished.
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'postgres', '-d', 'postgres']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
